[tool.poetry]
name = "py-portfolio"
version = "1.0.0"
description = ""
authors = ["Mitko Tochev <mr.sir88@gmail.com>"]
readme = "README.md"
packages = [{include = "pyp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = "^2.0.36"
matplotlib = "^3.9.3"
freecurrencyapi = "^0.1.0"
python-dotenv = "^1.0.1"
typer = "^0.25.1"
yfinance = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest-mock = "^3.14.0"
pre-commit = "^4.0.1"
ruff = "^0.15.12"
mypy = "^2.0.0"
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
pandas-stubs = "^3.0.0.260204"

[tool.poetry.scripts]
pyp = "pyp.cli.main:app"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
preview = true

[tool.ruff.lint]
extend-select = ["I"]
select = ["E", "F", "I", "W"]

[tool.mypy]
files = "**/*.py"

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "freecurrencyapi.*",
]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"




